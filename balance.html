<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Budget app</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <link rel="stylesheet" href="stylesHome.css"> 
  
</head>
<body>

  <header>

    <nav class="navbar navbar-expand-lg navbar-dark py-0">

      <a class="navbar-brand" href="home.html"><img src="./assets/images/logo.png" class="logo" alt=""></a>

      <button class="navbar-toggler me-3" type="button"        data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">

        <span class="navbar-toggler-icon"></span>

      </button>

      <div class="collapse navbar-collapse" id="navbarSupportedContent">

      <ul class="navbar-nav mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="home.html">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="income.html">Add income</a>
        </li> 
        <li class="nav-item">
          <a class="nav-link" href="#">Add expense</a>
        </li> 
        <li class="nav-item dropdown">

          <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            Display balance
          </a>
          <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
            <li><a class="dropdown-item" href="balance.html">Current month</a></li>
            <li><a class="dropdown-item" href="balance.html">Previous month</a></li>
            <li><a class="dropdown-item" href="balance.html">Current year</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="balance.html">non-standard</a></li>
          </ul>

        </li> 
        <li class="nav-item">
          <a class="nav-link" href="#">Settings</a>
        </li> 
        <li class="nav-item">
          <a class="nav-link" href="index.html">Logout</a>
        </li>
      </ul>

      </div>
      
    </nav>

  </header>

  <main>

    <header>
      <h1>Check balance</h1>
    </header>

    <section>

      <form action="balance" id="balance" method="post" novalidate>

        <div class="field-balance">
          <label for="periods">For which period would you like to see the balance:</label>
          <select id="periods">

            <option>Current month</option>
            <option>Previous month</option>
            <option>Current year</option>
            <option>non-standard</option>

          </select>

          <div class="modal" id="modalWithDates" tabindex="-1">
            <div class="modal-dialog">
              <div class="modal-content">
                <div class="modal-header">
                  <h5 class="modal-title">Modal title</h5>
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
              <div class="modal-body">
                  <p>Modal body text goes here.</p>
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                  <button type="button" class="btn btn-primary">Save changes</button>
                </div>
              </div>
            </div>
          </div>

        </div>

      </form>

    </section>

  </main>

  <footer>
    <small>® Personal Budget 2026. All rights reserved.</small>
  </footer>
 
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

  <script src="balance.js"></script>


</body>
</html>
