<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Budget app</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <link rel="stylesheet" href="styles.css"> 
  
</head>
<body>

  <header>
    <img src="assets/images/logo.png" class="logo" alt="">
    <h1>Sign up</h1>
  </header>

  <main>

    <form class="pb-3"  action="signin" method="post" novalidate>

      <div class="field">
        <label for="login" class="visually-hidden">Username</label>
        <input id="login" type="text" name="username" placeholder="username"
          autocomplete="given-username" required aria-describedby="username-error">
        <p id="username" class="error" aria-live="polite"></p>
      </div>

      <div class="field">
        <label for="email" class="visually-hidden">Email</label>
        <input id="email" type="email" name="email" placeholder="email"
          autocomplete="email" required aria-describedby="email-error">
        <p id="email-error" class="error" aria-live="polite"></p>
      </div>

      <div class="field">
        <label for="password" class="visually-hidden">Password</label>
        <input id="password" type="password" name="password" placeholder="password" required aria-describedby="password-error">
        <p id="password-error" class="error" aria-live="polite"></p>
      </div>

      <div class="field">
        <label for="repeat-password" class="visually-hidden">Repeat Password</label>
        <input id="repeat-password" type="password" name="password" placeholder="repeat password" required aria-describedby="repeat-password-error">
        <p id="repeat-password-error" class="error" aria-live="polite"></p>
      </div>

      <button type="submit" class="btn btn-lg btn-primary">Sign in</button>

    </form>




  </main>







</body>
</html>
