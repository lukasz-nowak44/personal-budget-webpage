<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Budget app</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <link rel="stylesheet" href="styles.css"> 
  
</head>
<body>

  <div class="container external-box p-4">

    <div class="row">

      <header>
        <div class="d-flex align-items-center">
          <img src="assets/images/logo.png" class="logo" alt="">
          <h1 class="registration">Sign up! 🡇</h1>
        </div>
      </header>

      <main class="col-md-8 col-lg-6">

        <form class="pb-3"  action="signin" method="post" novalidate>

          <div class="field">
            <label for="login" class="visually-hidden">Username</label>
            <img src="assets/icons/user.svg" alt="" />
            <input id="login" type="text" name="username" placeholder="username"
              autocomplete="given-username" required aria-describedby="username-error">            
          </div>
          <p id="username-error" class="error" aria-live="polite"></p>

          <div class="field">
            <label for="email" class="visually-hidden">Email</label>
            <img src="assets/icons/at.svg" alt="" />
            <input id="email" type="email" name="email" placeholder="email"
              autocomplete="email" required aria-describedby="email-error">            
          </div>
          <p id="email-error" class="error" aria-live="polite"></p>

          <div class="field">
            <label for="password" class="visually-hidden">Password</label>
            <img src="assets/icons/lock-password.svg" alt="" />
            <input id="password" type="password" name="password" placeholder="password" required aria-describedby="password-error">            
          </div>
          <p id="password-error" class="error" aria-live="polite"></p>

          <div class="field">
            <label for="repeat-password" class="visually-hidden">Repeat Password</label>
            <img src="assets/icons/lock-plus.svg" alt="" />
            <input id="repeat-password" type="password" name="password" placeholder="repeat password" required aria-describedby="repeat-password-error">           
          </div>
          <p id="repeat-password-error" class="error" aria-live="polite"></p>

          <div class="form-check">
            <label class="form-check-label pb-3" for="agreement"><input class="form-check-input me-2" type="checkbox" name="agreement" id="agreement"aria-label="agreement to the terms and conditions" aria-describedby="agreement-error" required>
              <small>If you want to use our application you need to approve our <a href="./terms.html">terms and conditions</a></small>
            </label>
          </div><p id="agreement-error" class="agreement-error" aria-live="polite"></p>

          <button type="submit" class="btn btn-lg btn-primary">Sign up</button>

        </form>

        <a href="index.html" aria-label="return to main page">⤆ Return  for signing in</a>

      </main>

    </div>

  </div>

  <footer>
    <small>® Personal Budget 2026. All rights reserved.</small>
  </footer>

  <script src="registration.js"></script>

</body>
</html>
